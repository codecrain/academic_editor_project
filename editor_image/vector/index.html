<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tlooto Vector Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <strong>Vector Studio</strong>
    <nav aria-label="Document actions">
      <button data-action="new">New</button>
      <label class="file-button">Open SVG/JSON<input id="open-file" type="file" accept=".svg,.json,image/svg+xml,application/json"></label>
      <button data-action="save-project">Save editable JSON</button>
      <button data-action="export-svg">Export SVG</button>
      <button data-action="export-png">Export PNG</button>
      <a href="../">Raster Studio</a>
    </nav>
  </header>
  <main>
    <aside id="tools" aria-label="Vector tools">
      <button data-tool="select" class="active">Select</button>
      <button data-tool="draw">Pencil</button>
      <button data-tool="rect">Rectangle</button>
      <button data-tool="ellipse">Ellipse</button>
      <button data-tool="triangle">Triangle</button>
      <button data-tool="line">Line</button>
      <button data-tool="text">Text</button>
      <hr>
      <label>Fill <input id="fill" type="color" value="#2563eb"></label>
      <label>Stroke <input id="stroke" type="color" value="#111827"></label>
      <label>Width <input id="stroke-width" type="number" min="0" max="100" step="1" value="2"></label>
      <hr>
      <button data-action="duplicate">Duplicate</button>
      <button data-action="group">Group</button>
      <button data-action="ungroup">Ungroup</button>
      <button data-action="front">Bring front</button>
      <button data-action="back">Send back</button>
      <button data-action="delete">Delete</button>
      <hr>
      <button data-action="undo">Undo</button>
      <button data-action="redo">Redo</button>
      <label>Zoom <input id="zoom" type="range" min="10" max="400" value="100"></label>
    </aside>
    <section id="stage" aria-label="Artboard">
      <canvas id="canvas" width="1200" height="800"></canvas>
    </section>
    <aside id="layers-panel">
      <h2>Layers / Objects</h2>
      <ol id="layers"></ol>
    </aside>
  </main>
  <output id="status" aria-live="polite"></output>
  <script type="module" src="./app.js"></script>
</body>
</html>
